[project]
name = "annalyzer-patchcore"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib==2.2.0",
    "psutil==7.2.2",
    "requests>=2.32.5,<3",  # Anomalib imports this through its bundled video models.
    "timm==1.0.22",
    "torch==2.9.1+cu128",
    "torchvision==0.24.1+cu128",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
