[project]
name = "annalyzer-unet"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "opencv-python-headless==5.1.0.95",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "scikit-learn==1.9.1",
    "torch==2.9.1+cu128",
    "torchvision==0.24.1+cu128",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
